<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智服3D · 演示控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="bar"></span>
        <div>
          <h1>智服3D 售后助手</h1>
          <small>AFTER-SALES ASSISTANT CONSOLE</small>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="view-user">用户端</button>
        <button class="tab" data-view="view-agent">坐席台</button>
        <button class="tab" data-view="view-knowledge">知识库</button>
      </nav>
      <div class="top-actions">
        <div class="sid">会话 <span id="sessionId"></span></div>
        <button id="newSession" class="btn-ghost">＋ 新建会话</button>
      </div>
    </header>

    <main>
      <section id="view-user" class="view active">
        <div class="pane user-pane">
          <div class="pane-head"><span class="dot"></span>用户对话 · 实时流式</div>
          <div id="chatMessages" class="messages"></div>
          <footer class="composer">
            <input id="chatInput" placeholder="例如：Ender-3 V3 KE 打印第一层翘边怎么办">
            <button id="chatSend">发送</button>
          </footer>
        </div>
      </section>

      <section id="view-agent" class="view">
        <div class="pane agent-pane">
          <div class="pane-head">
            坐席工作台
            <div class="agent-toolbar">
              <label>坐席姓名</label>
              <input id="operatorName" value="坐席A">
            </div>
          </div>
          <div class="agent-body">
            <section class="queue">
              <h2>转人工队列 <span id="queueCount" class="badge"></span></h2>
              <div id="queueList" class="queue-list"></div>
            </section>
            <section class="workarea">
              <div id="agentEmpty" class="empty">领取队列中的会话后，在此查看上下文并回复</div>
              <div id="agentDetail" class="agent-detail hidden">
                <div class="ctx-card">
                  <h2>上下文卡片</h2>
                  <div id="ctxContent"></div>
                </div>
                <div id="agentMessages" class="messages"></div>
                <div class="draft-card">
                  <h2><button id="draftToggle" class="draft-toggle" type="button">工单草稿</button></h2>
                  <div id="draftBody" class="draft-body hidden">
                    <div class="draft-grid">
                      <label>分类
                        <select id="ticketCategory">
                          <option value="咨询">咨询</option>
                          <option value="故障">故障</option>
                          <option value="售后">售后</option>
                          <option value="投诉">投诉</option>
                        </select>
                      </label>
                      <label>机型
                        <select id="ticketModel"><option value="">未指定</option></select>
                      </label>
                    </div>
                    <div class="draft-meta">会话 ID：<span id="draftSessionId">—</span></div>
                    <textarea id="ticketSummary" rows="3" placeholder="工单摘要"></textarea>
                    <div class="draft-actions">
                      <button id="ticketSubmit">提交工单</button>
                      <button id="sessionClose" class="danger">关闭会话</button>
                    </div>
                  </div>
                </div>
                <footer class="composer">
                  <input id="agentInput" placeholder="输入回复内容">
                  <button id="agentSend">回复</button>
                </footer>
              </div>
            </section>
            <section class="handled">
              <h2>已接待客户 <span id="handledCount" class="badge"></span></h2>
              <div id="handledList" class="queue-list"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="view-knowledge" class="view">
        <div class="pane knowledge-pane">
          <div class="pane-head"><span class="dot"></span>知识库导入</div>
          <div class="kbody">
            <div class="kform">
              <div id="dropZone" class="drop-zone">
                <div class="dz-icon">＋</div>
                <p>拖拽或点击选择文件（.pdf / .md）</p>
                <input type="file" id="fileInput" accept=".pdf,.md" hidden>
                <div id="fileName" class="file-name"></div>
              </div>
              <div class="krow">
                <label>知识类型
                  <select id="knowledgeType">
                    <option value="faq">FAQ 问答</option>
                    <option value="manual">产品手册</option>
                    <option value="troubleshooting">故障排查</option>
                    <option value="policy">政策条款</option>
                  </select>
                </label>
                <label>适用机型
                  <select id="productModel">
                    <option value="general">通用（general）</option>
                  </select>
                </label>
              </div>
              <button id="uploadBtn" class="primary" disabled>上传并导入</button>
            </div>
            <div id="taskCard" class="task-card hidden">
              <h3>导入进度</h3>
              <div id="taskStatus" class="task-status">pending</div>
              <div id="taskNodes" class="task-nodes"></div>
              <div id="taskError" class="task-error"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
